version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: officerestore-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: officerestore_bot
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: officerestore-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/officerestore_bot
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: officerestore-web
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  mongo_data:
  api_logs:
